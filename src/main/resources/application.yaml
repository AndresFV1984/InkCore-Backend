spring:
  application:
    name: InkCore-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}

  servlet:
    multipart:
      # Estimación de tinta / TIFF de pliego: techo alto (también inkcore.ink-estimation.absolute-max-file-bytes)
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:512MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:520MB}
      file-size-threshold: ${MULTIPART_FILE_SIZE_THRESHOLD:520MB}

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

server:
  servlet:
    context-path: ${APP_CONTEXT:/InkCore-backend}
  tomcat:
    max-http-form-post-size: 520MB
    max-swallow-size: 520MB
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  paths-to-exclude: /error,/error/**

# Conversión RGB→CMYK (perfiles en classpath:/color-profiles/)
# icc-cache se configura por perfil (application-dev / application-docker / application-prod)
inkcore:
  color-conversion:
    source-icc-profile: ${COLOR_SOURCE_ICC:sRGB.icc}
    destination-icc-profile: ${COLOR_DEST_ICC:FOGRA39.icc}
    # PDF: 600 dpi si hay que rasterizar; preferEmbeddedPdfImages evita re-rasterizar fotos embebidas
    pdf-enabled: ${COLOR_PDF_ENABLED:true}
    min-image-resolution-dpi: ${COLOR_MIN_DPI:600}
    prefer-embedded-pdf-images: ${COLOR_PREFER_EMBEDDED_PDF_IMAGES:true}
    # Calidad comercial por defecto (fotos). CTP puro: env vars a 0/0/false o qualityPreset=FIDELITY.
    brightness-lift: ${COLOR_BRIGHTNESS_LIFT:0.12}
    vibrance-boost: ${COLOR_VIBRANCE_BOOST:0.28}
    soft-proof-brightness-match: ${COLOR_SOFT_PROOF_BRIGHTNESS_MATCH:true}
    # LittleCMS (lcms2): BPC. Nativa empaquetada en el JAR (JNA). Override opcional:
    black-point-compensation: ${COLOR_BLACK_POINT_COMPENSATION:true}
    lcms-library-path: ${LCMS_LIBRARY_PATH:}

  # Estimación de consumo de tinta (formulario "Estimar tintas")
  # Método libre: PDFBox + ICC color.org (sin Ghostscript AGPL ni RIP de pago)
  ink-estimation:
    default-width-cm: ${INK_DEFAULT_WIDTH_CM:70}
    default-height-cm: ${INK_DEFAULT_HEIGHT_CM:100}
    default-dpi: ${INK_DEFAULT_DPI:300}
    default-grams-per-cm2-at-full-coverage: ${INK_DEFAULT_G_CM2:0.00021}
    # Factores por canal (si el cliente NO envía gramsPerCm2). Heurística offset.
    channel-grams-per-cm2:
      cyan: ${INK_G_CM2_C:0.00021}
      magenta: ${INK_G_CM2_M:0.00021}
      yellow: ${INK_G_CM2_Y:0.00020}
      black: ${INK_G_CM2_K:0.00022}
      spot: ${INK_G_CM2_SPOT:0.00025}
    # Precisión RGB→CMYK (BALANCED). Subir = más precisión / más CPU. Bajar = más rápido.
    # FAST≈1e6/512 · BALANCED≈2e6/1024 · HIGH≈4e6/2048 (respetar RAM del host)
    max-analysis-pixels: ${INK_MAX_ANALYSIS_PIXELS:4000000}
    rgb-image-max-edge: ${INK_RGB_IMAGE_MAX_EDGE:2048}
    # BPC LittleCMS en estimación (independiente de color-conversion.*)
    black-point-compensation: ${INK_BLACK_POINT_COMPENSATION:true}
    absolute-max-file-bytes: ${INK_ABSOLUTE_MAX_BYTES:536870912}
    size-tolerance-min-ratio: ${INK_SIZE_TOL_MIN:0.01}
    size-tolerance-max-ratio: ${INK_SIZE_TOL_MAX:2.5}
    analysis-icc-profile: ${INK_ANALYSIS_ICC:FOGRA39.icc}
    max-concurrent-object-downloads: ${INK_MAX_CONCURRENT_OBJECT_DOWNLOADS:8}
