# Perfil Spring de la app dentro del Compose (SPRING_PROFILES_ACTIVE=docker).
# Este archivo NO crea contenedores. Los servicios los define docker-compose.yml.
#
# Hostnames que SÍ usa la app en runtime (red interna Compose):
# - db            Postgres app      → 5432
# - redis         Redis             → 6379
# - minio         Object storage    → 9000 (en el host: 9100 API / 9101 consola)
#
# Solo existen si Compose los arranca (no hay beans/URLs aquí):
# - sonarqube     Análisis estático → 9000 en el host
# - redis-insight UI Redis          → 8092 en el host
#
# En el host (navegador / Maven):
# - API app:           http://localhost:8086/InkCore-backend
# - MinIO API:         http://localhost:9100  (app: usuario inkcore-app, no root)
# - MinIO consola:     http://localhost:9101  (login: MINIO_ROOT_USER / minioadmin)
# - Redis Insight:     http://localhost:8092
# - SonarQube:         http://localhost:9000
spring:
  # Sin hot-reload: el classpath de la imagen no cambia
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/inkcore}
    username: ${DB_USERNAME:indicolors_app}
    password: ${DB_PASSWORD:5p5g+OQu9X6/cdi23jLKiTqSpAfgWCiS}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_POOL_NAME:indicolorsHikariPool}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:40}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_THRESHOLD_MS:0}
      initialization-fail-timeout: ${DB_POOL_INIT_FAIL_TIMEOUT_MS:60000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_schema: indicolors
        query:
          fail_on_pagination_over_collection_fetch: true
        default_batch_fetch_size: 25

  main:
    lazy-initialization: ${SPRING_LAZY_INIT:false}

  data:
    jpa:
      repositories:
        enabled: true
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true
    user: ${FLYWAY_MIGRATION_USER:indicolors_owner}
    password: ${FLYWAY_MIGRATION_PASSWORD:YyZUdfRUcjJmiFxrkr5DP77mZD4hlRo1}
    schemas: indicolors
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:false}

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}

server:
  port: ${SERVER_PORT:8086}
  servlet:
    context-path: ${APP_CONTEXT:/InkCore-backend}
  tomcat:
    max-http-form-post-size: 55MB
    max-swallow-size: 55MB
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:100}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:400}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-operation-id: true
    tags-sorter: alpha
    operations-sorter: alpha
    disable-swagger-default-url: true
    persist-authorization: true
  paths-to-exclude: /error

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    expiration-seconds: ${JWT_EXP_SECONDS:3600}
  dev:
    permit-all: ${SECURITY_PERMIT_ALL:false}
  refresh-token:
    expiration-seconds: ${REFRESH_EXP_SECONDS:1209600}
    rotate-on-refresh: ${REFRESH_ROTATE_ON_REFRESH:true}
    store:
      # RedisStoreConfig importa RedisAutoConfiguration cuando type=redis
      type: ${REFRESH_TOKEN_STORE_TYPE:redis}
  token-version-cache:
    type: ${TOKEN_VERSION_CACHE_TYPE:redis}
    ttl-seconds: ${TOKEN_VERSION_CACHE_TTL_SECONDS:60}
  password:
    max-failed-attempts: ${PASSWORD_MAX_FAILED_ATTEMPTS:5}
    lock-duration-minutes: ${PASSWORD_LOCK_DURATION_MINUTES:15}
    expiration-days: ${PASSWORD_EXPIRATION_DAYS:90}
    warning-days: ${PASSWORD_WARNING_DAYS:7}

inkcore:
  color-conversion:
    brightness-lift: ${COLOR_BRIGHTNESS_LIFT:0.12}
    vibrance-boost: ${COLOR_VIBRANCE_BOOST:0.28}
    soft-proof-brightness-match: ${COLOR_SOFT_PROOF_BRIGHTNESS_MATCH:true}
    icc-cache:
      type: ${ICC_CACHE_TYPE:redis}
      ttl-seconds: ${ICC_CACHE_TTL_SECONDS:86400}
  object-storage:
    # MinIO en la red Compose (servicio minio:9000). En el host el mapeo es 9100.
    type: ${OBJECT_STORAGE_TYPE:s3}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://minio:9000}
    public-endpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:http://localhost:9100}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:inkcore}
    # Usuario de aplicación (no root). Lo crea minio-init con política solo CRUD de objetos.
    # CORS e ILM los aplica minio-init con root; la app no los toca en runtime.
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:inkcore-app}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:inkcore-app-dev-only-change-me}
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE:true}
    presigned-url-ttl-seconds: ${OBJECT_STORAGE_PRESIGNED_TTL:300}
    max-asset-file-bytes: ${OBJECT_STORAGE_MAX_ASSET_BYTES:536870912}
    max-preview-file-bytes: ${OBJECT_STORAGE_MAX_PREVIEW_BYTES:2097152}
    cors-allowed-origins: ${OBJECT_STORAGE_CORS_ORIGINS:http://localhost:8085,http://127.0.0.1:8085,http://192.168.1.250:8085}
    staging-expiration-days: ${OBJECT_STORAGE_STAGING_EXPIRY_DAYS:7}
    staging-fallback-expiration-days: ${OBJECT_STORAGE_STAGING_FALLBACK_EXPIRY_DAYS:30}
    legacy-staging-cleanup-days: ${OBJECT_STORAGE_LEGACY_STAGING_CLEANUP_DAYS:7}
    legacy-staging-cleanup-interval-ms: ${OBJECT_STORAGE_LEGACY_STAGING_CLEANUP_INTERVAL_MS:86400000}
    manage-bucket: ${OBJECT_STORAGE_MANAGE_BUCKET:false}
    allow-insecure-defaults: ${OBJECT_STORAGE_ALLOW_INSECURE_DEFAULTS:true}
    startup-retry-attempts: ${OBJECT_STORAGE_STARTUP_RETRIES:12}
    startup-retry-backoff-ms: ${OBJECT_STORAGE_STARTUP_RETRY_BACKOFF_MS:2000}
    operation-retry-attempts: ${OBJECT_STORAGE_OPERATION_RETRIES:3}
    operation-retry-backoff-ms: ${OBJECT_STORAGE_OPERATION_RETRY_BACKOFF_MS:200}
    operation-timeout-ms: ${OBJECT_STORAGE_OPERATION_TIMEOUT_MS:60000}

app:
  cors:
    allowed-origins:
      - http://localhost:8085
      - http://127.0.0.1:8085
      - http://192.168.1.250:8085
    origins: ${CORS_ALLOWED_ORIGINS:}
    allow-credentials: false
    max-age-seconds: 3600

logging:
  level:
    root: INFO
    com.inkcore: DEBUG
    org.hibernate.orm.connections.pooling: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.data.redis: WARN
    com.zaxxer.hikari: INFO
    com.zaxxer.hikari.pool.HikariPool: WARN
