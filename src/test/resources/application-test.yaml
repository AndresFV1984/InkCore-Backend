spring:
  datasource:
    url: jdbc:h2:mem:indicore_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS indicolors
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        default_schema: indicolors
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: 012345678901234567890123456789012

security:
  jwt:
    secret: 012345678901234567890123456789012
    expiration-seconds: 3600
  refresh-token:
    expiration-seconds: 1209600
    rotate-on-refresh: true
    store:
      type: memory
  dev:
    permit-all: true

inkcore:
  color-conversion:
    source-icc-profile: sRGB.icc
    destination-icc-profile: FOGRA39.icc
    pdf-enabled: true
    min-image-resolution-dpi: 72
    brightness-lift: 0
    vibrance-boost: 0
    soft-proof-brightness-match: false
    icc-cache:
      type: memory
      ttl-seconds: 3600
  ink-estimation:
    default-width-cm: 70
    default-height-cm: 100
    default-dpi: 72
    default-grams-per-cm2-at-full-coverage: 0.00021
    channel-grams-per-cm2:
      cyan: 0.00021
      magenta: 0.00021
      yellow: 0.00020
      black: 0.00022
      spot: 0.00025
    max-analysis-pixels: 250000
    rgb-image-max-edge: 256
    absolute-max-file-bytes: 10485760
    analysis-icc-profile: FOGRA39.icc
  object-storage:
    type: memory
    presigned-url-ttl-seconds: 300
    max-asset-file-bytes: 26214400
    max-preview-file-bytes: 2097152
    staging-expiration-days: 0
    staging-fallback-expiration-days: 0
    legacy-staging-cleanup-days: 0
    allow-insecure-defaults: true
