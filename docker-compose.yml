# Stack InkCore: solo imágenes de Docker Hub. El cliente no necesita el repo ni scripts/.
# Oficiales: postgres base va embebida en inkcore-postgres; minio, redis, sonar.
# Propias: bayronindicore/inkcore-backend, inkcore-minio-init, inkcore-postgres.
services:
  db:
    image: bayronindicore/inkcore-postgres:${IMAGE_TAG:-latest}
    container_name: inkcore-postgres
    environment:
      # BD + owner: la imagen crea inkcore / indicolors_owner.
      # Roles app/admin, schema, grants: embebidos en la imagen (docker-init).
      # Tablas/seeds: Flyway al arrancar la app.
      POSTGRES_DB: inkcore
      POSTGRES_USER: indicolors_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-YyZUdfRUcjJmiFxrkr5DP77mZD4hlRo1}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - inkcore_postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicolors_owner -d inkcore"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inkcore-redis
    ports:
      - "6379:6379"
    volumes:
      - inkcore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Insight se levanta con Redis (un `up app` ya arranca redis).
    # No al revés: redis-insight.depends_on redis + esto sería un ciclo.
    depends_on:
      redis-insight:
        condition: service_started
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: inkcore-redis-insight
    ports:
      - "8092:5540"
    volumes:
      - redis-insight-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: inkcore-minio
    command: server /data --console-address ":9001"
    environment:
      # Root solo para consola (9101) e init. La app NO usa estas claves.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # MinIO Community: CORS global (no soporta mc cors set por bucket). Misma lista que minio-init.
      MINIO_API_CORS_ALLOW_ORIGIN: ${OBJECT_STORAGE_CORS_ORIGINS:-http://localhost:8085,http://127.0.0.1:8085,http://192.168.1.250:8085}
    ports:
      # 9100/9101 en host: evita conflicto con SonarQube (9000)
      - "9100:9000"
      - "9101:9001"
    volumes:
      - inkcore_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: bayronindicore/inkcore-minio-init:${IMAGE_TAG:-latest}
    container_name: inkcore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-inkcore-app}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-inkcore-app-dev-only-change-me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-inkcore}
      # CORS e ILM con root; el usuario inkcore-app no tiene esas acciones.
      OBJECT_STORAGE_CORS_ORIGINS: ${OBJECT_STORAGE_CORS_ORIGINS:-http://localhost:8085,http://127.0.0.1:8085,http://192.168.1.250:8085}
      OBJECT_STORAGE_STAGING_EXPIRY_DAYS: ${OBJECT_STORAGE_STAGING_EXPIRY_DAYS:-2}
      OBJECT_STORAGE_STAGING_FALLBACK_EXPIRY_DAYS: ${OBJECT_STORAGE_STAGING_FALLBACK_EXPIRY_DAYS:-30}
    restart: "no"

  sonar-db:
    image: postgres:16-alpine
    container_name: inkcore-sonar-postgres
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.5-community
    container_name: inkcore-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Docker Desktop / Windows: evita que ElasticSearch rechace el arranque por mmap.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  app:
    image: bayronindicore/inkcore-backend:${IMAGE_TAG:-latest}
    container_name: inkcore-backend
    ports:
      - "8086:8086"
    environment:
      # Base de datos (DB_* para yaml de perfil; SPRING_DATASOURCE_* por si el perfil no carga)
      DB_URL: jdbc:postgresql://db:5432/inkcore
      DB_USERNAME: indicolors_app
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-5p5g+OQu9X6/cdi23jLKiTqSpAfgWCiS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/inkcore
      SPRING_DATASOURCE_USERNAME: indicolors_app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:-5p5g+OQu9X6/cdi23jLKiTqSpAfgWCiS}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FLYWAY_MIGRATION_USER: indicolors_owner
      FLYWAY_MIGRATION_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-YyZUdfRUcjJmiFxrkr5DP77mZD4hlRo1}
      # Redis (perfil docker: refresh tokens + caché ICC)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REFRESH_TOKEN_STORE_TYPE: ${REFRESH_TOKEN_STORE_TYPE:-redis}
      TOKEN_VERSION_CACHE_TYPE: ${TOKEN_VERSION_CACHE_TYPE:-redis}
      ICC_CACHE_TYPE: ${ICC_CACHE_TYPE:-redis}
      # JWT (SECURITY_JWT_SECRET mapea a security.jwt.secret aunque el perfil no cargue)
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-en-produccion-por-clave-segura}
      SECURITY_JWT_SECRET: ${JWT_SECRET:-cambia-esto-en-produccion-por-clave-segura}
      JWT_EXP_SECONDS: 3600
      REFRESH_EXP_SECONDS: 86400
      # Spring — perfiles: docker (Compose) | dev (local) | prod
      SPRING_LAZY_INIT: "false"
      SERVER_PORT: 8086
      APP_CONTEXT: /InkCore-backend
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8085,http://127.0.0.1:8085}
      OBJECT_STORAGE_TYPE: ${OBJECT_STORAGE_TYPE:-s3}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-inkcore-app}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-inkcore-app-dev-only-change-me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-inkcore}
      OBJECT_STORAGE_PATH_STYLE: ${OBJECT_STORAGE_PATH_STYLE:-true}
      # Localhost para desarrollo local (front y backend en la misma máquina).
      # En cliente remoto, sobrescribir en .env (ej: http://IP_O_DNS_DEL_SERVIDOR:9100).
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9100}
      OBJECT_STORAGE_CORS_ORIGINS: ${OBJECT_STORAGE_CORS_ORIGINS:-http://localhost:8085,http://127.0.0.1:8085,http://192.168.1.250:8085}
      OBJECT_STORAGE_STAGING_EXPIRY_DAYS: ${OBJECT_STORAGE_STAGING_EXPIRY_DAYS:-2}
      OBJECT_STORAGE_STAGING_FALLBACK_EXPIRY_DAYS: ${OBJECT_STORAGE_STAGING_FALLBACK_EXPIRY_DAYS:-30}
      OBJECT_STORAGE_LEGACY_STAGING_CLEANUP_DAYS: ${OBJECT_STORAGE_LEGACY_STAGING_CLEANUP_DAYS:-2}
      OBJECT_STORAGE_LEGACY_STAGING_CLEANUP_INTERVAL_MS: ${OBJECT_STORAGE_LEGACY_STAGING_CLEANUP_INTERVAL_MS:-86400000}
      # Esperar a Postgres en arranque (default yaml 1ms es demasiado agresivo en Docker)
      DB_POOL_INIT_FAIL_TIMEOUT_MS: ${DB_POOL_INIT_FAIL_TIMEOUT_MS:-60000}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MaxRAMPercentage=75.0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        # Espera a que el job termine (usuario, bucket, CORS, ILM). No es solo orden de arranque.
        condition: service_completed_successfully
      # UIs / herramientas: un `up app` (IDE) no las crea si no están en este grafo.
      # service_started: no bloquea la API a que Sonar quede healthy.
      sonar-db:
        condition: service_started
      sonarqube:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8086${APP_CONTEXT:-/InkCore-backend}/actuator/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 90s

volumes:
  inkcore_postgres_data:
  inkcore_redis_data:
  inkcore_minio_data:
  redis-insight-data:
  sonar_postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
